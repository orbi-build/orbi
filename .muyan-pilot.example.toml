# Copy this file to muyan-pilot.toml and edit it for your machine.
source_repos = [
  "OWNER/PILOT-REPO",
  "OWNER/BACKLOG-REPO",
]

repo_dir = "."
workspace_root = ".."
prompt = "prompt.md"
# Implementer prompt (default prompt.md). The Runner also runs an
# independent review session on the opened PR, then merges a clean PR
# via `gh pr merge --match-head-commit`; the fixer reuses the
# implementer prompt (its resume section is injected when a PR already
# exists). The review prompt defaults to prompt_review.md in this
# directory.
prompt_review = "prompt_review.md"
# Delivery base branch: every task worktree is created from the latest
# origin/<base_branch> (fetched and frozen at claim time). Default: "main".
base_branch = "main"
# Claim scope (Issue #139): the active GitHub Milestone title (e.g.
# "v0.2.0") that the fresh-claim scans (p0, bug, plain) are restricted
# to. The milestone:"<title>" qualifier is part of the gh search query,
# so an Issue of another Milestone (or of no Milestone) never enters the
# queue of this Runner; `ai-ready` stays the execution switch and the
# pickup order (p0 -> bug -> plain) is unchanged. P0 does not cross
# milestones. Resume states (opened PRs, in-flight restarts) are never
# gated by the Milestone. Leave it out (or comment it out) to keep the
# pre-#139 behavior: every `ai-ready` Issue is claimable. It is never
# guessed — an empty or non-string value fails the start fast.
# active_milestone = "v0.2.0"
# Disabled by default. When true, a failed release test command with captured
# output creates (or deduplicates) an ai-ready + bug repair Issue. The Release
# itself remains ai-blocked and must be explicitly re-run after review/merge.
# auto_repair_issues = true
# Maximum concurrent Pilot tasks on this machine. Must be a positive integer;
# missing means 1. The local AI/GPU can only serve one stable task, so keep
# the default. A slot (flock on <repo_dir>/.muyan-pilot/slots/slot-N) is
# taken before any claim and held for the whole delivery lifecycle
# (implement -> review -> fix -> merge); the kernel releases it when the
# Runner exits, however it exits. A Runner that cannot take a slot logs
# capacity_full and exits without claiming an Issue.
max_concurrency = 1
# Optional Pi model selection (Issue #119): passed to EVERY Pi session
# (implement and review) as --provider/--model/--thinking. Omit a key to
# keep Pi's own default for that setting; values are passed verbatim and
# recorded in the journal (non-sensitive model identifiers, never keys).
# pi_provider = "openai"
# pi_model = "gpt-5.6-sol"
# pi_thinking = "medium"
# Optional provider file (Issue #157): path to a JSON file in Pi's
# models.json shape (providers with baseUrl / api / apiKey / models).
# The file is the ONLY place a provider endpoint (baseUrl) may be
# configured; the TOML only selects the runtime provider/model above.
# `apiKey` is an env-var reference like "$GROQ_API_KEY" — never a key
# value. The Runner validates the file at startup (fail fast on a
# missing baseUrl, a selected provider/model that does not exist, or a
# missing env var for the selected provider's key) and passes the
# catalog to Pi through a per-run agent dir (PI_CODING_AGENT_DIR).
# pi_providers = ".muyan-pilot/pi-providers.json"

# Optional Pi skills. Paths may be absolute, use ~, or be relative to this file.
skills = []

# Optional Markdown context files injected into the prompt as paths.
context_files = []
