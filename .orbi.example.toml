# Copy this file to orbi.toml and edit it for your machine.
# Exactly ONE source repository until multi-repo workspaces ship
# (Issue #133): multiple entries fail fast at startup.
source_repos = [
  "OWNER/PILOT-REPO",
]

repo_dir = "."
# Deployment home (Issue #330): the orbi SOURCE checkout — where the
# editable CLI install comes from, where the systemd/ unit templates and
# labels.toml live, and where the prompt defaults (prompts/prompt.md,
# prompts/prompt_review.md) resolve when unset. Default: repo_dir — the
# orbi-bootstrap deployment (repo_dir IS the orbi checkout) keeps its
# exact behavior. Set it to the orbi checkout path when repo_dir points
# at a foreign user repo X (external single-repo mode): orbi is then
# installed ONCE from the orbi repo and delivers Issues of X. The
# installed systemd unit reads its config from <deploy_home>/orbi.toml,
# so the config file (and .orbi/env) must live in the deploy home.
# Must be a non-empty string; a missing directory fails the start fast.
# deploy_home = "/path/to/orbi"
workspace_root = ".."
prompt = "prompts/prompt.md"
# Implementer prompt (default prompts/prompt.md). The Runner also runs an
# independent review session on the opened PR, then merges a clean PR
# via `gh pr merge --match-head-commit`; the fixer reuses the
# implementer prompt (its resume section is injected when a PR already
# exists). The review prompt defaults to prompts/prompt_review.md in this
# directory.
prompt_review = "prompts/prompt_review.md"
# Delivery base branch: every task worktree is created from the latest
# origin/<base_branch> (fetched and frozen at claim time). Default: "main".
base_branch = "main"
# Delivery checkout transport (Issue #580): how git data operations
# (fetch/push, including .github/workflows/*.yml) authenticate on the
# checkout's single `origin` remote. "ssh" (default): the origin is
# git@github.com:owner/repo.git and the machine's SSH key authenticates;
# `orbi setup` migrates an HTTPS origin. "https": the origin stays on
# https://github.com/<repo>.git and the gh credential helper supplies
# the credentials (`gh auth login --with-token`) — the token-only
# sandbox path with no SSH private key. Anything else fails the config
# load fast.
# git_transport = "ssh"
# Engine source update channel (Issue #535): what THIS deploy home
# checkout follows at every service start. Host/deploy-only — it never
# goes into a repository's .github/orbi.toml. Forms:
#   absent / "main"     -> fast-forward origin/main (the dogfood behavior)
#   "branch:<name>"     -> fast-forward origin/<name>
#   "release"           -> newest official semver tag (pre-releases
#                          excluded), detached checkout; "stable" is an
#                          alias with the identical behavior
#   "tag:<name>"        -> exact tag lock (annotated tags dereferenced),
#                          detached checkout
#   "sha:<40-hex>"      -> exact commit lock, detached checkout
# New installs default to "release" (reproducible, safely rollback-able —
# rollback is editing the value back to the previous tag/SHA). "release"
# (or "stable") follows the newest PUBLISHED version — it changes only
# when a release ships; "main" follows the development mainline and
# changes with every commit. Pin "main" to keep tracking the engine's
# main branch like Orbi's own dogfood does. A dirty checkout, a missing
# tag/SHA or any unverifiable state fails the service start with a
# structured line carrying the fix.
engine_source_track = "release"
# To PIN the engine to one exact version (a common production need: a
# version change must be a deliberate operation, not an automatic
# follow-the-new-release) — comment out the line above, uncomment the
# line below and fill in the target tag. `tag:` never moves on its own;
# rolling back is putting the previous tag back.
# engine_source_track = "tag:v0.4.10"
# Offline escape hatch for the runner source freshness gate (Issue #525).
# Before any slot or claim the Runner proves the code it executes matches
# the configured engine source channel — engine_source_track (Issue #535),
# origin/main by default, never the delivery base_branch (the import
# checkout's HEAD for an editable install; the installed version vs the
# channel's release tag for a non-editable one — local git reads only).
# A stale or unverifiable source
# logs the structured `runner_source_stale` line (facts + fix) and fails
# the start. true downgrades the SAME line to a warning for offline /
# restricted-network machines — it never skips the check. Default: false.
# allow_stale_runner = false
# Claim scope (Issue #139): the active GitHub Milestone title (e.g.
# "v0.2.0") that the fresh-claim scans (p0, bug, plain) are restricted
# to. The milestone:"<title>" qualifier is part of the gh search query,
# so an Issue of another Milestone (or of no Milestone) never enters the
# queue of this Runner; `ai-ready` stays the execution switch and the
# pickup order (p0 -> bug -> plain) is unchanged. P0 does not cross
# milestones. Resume states (opened PRs, in-flight restarts) are never
# gated by the Milestone. Leave it out (or comment it out) to keep the
# pre-#139 behavior: every `ai-ready` Issue is claimable. It is never
# guessed — an empty or non-string value fails the start fast.
# active_milestone = "v0.2.0"
# When false, a closed active milestone pauses here and creates one
# ai-ready + p0 confirmation Issue instead of rewriting this file.
# Missing keeps the existing automatic-advance behavior.
# auto_next_milestone = true
# Hung-model-request threshold (Issue #228): seconds of silence in
# `model_wait` (the newest COMPLETE Pi session event is a tool result
# and no new event arrives) after which the Runner declares the model
# request hung, kills the Pi session and fails fast. This measures
# silence between complete session events — Pi does not stream
# token-level progress into the session JSONL, so it is NOT a
# token-level model timeout and a slow generation that keeps appending
# events never trips it. Default: 1800 (30 minutes) — a slow local
# model (e.g. a 27B Q4 GGUF behind a llama-server with a 1200 s request
# timeout: ~57 tokens/s at 12K context on an RX 7900 XTX with all
# layers on GPU, well under 20 tokens/s on partial GPU offload or
# CPU-only) survives a 10-minute complete message. Must
# be a finite positive number; anything else fails the start fast.
# model_wait_dead_seconds = 1800
# Swallowed-model-request probe (Issue #233): the model's /slots
# endpoint (the agent-facing port — the local-llm-kv-cache proxy passes
# it through from llama.cpp). While Pi is frozen in model_wait the
# Runner probes it; when EVERY slot reports idle (is_processing=false)
# for the sustained model_wait_probe_seconds grace the request was
# SWALLOWED (the model process is alive and the connection ESTABLISHED,
# but nothing is generating — the #231 scene) and the Pi session is
# killed fast, well before model_wait_dead_seconds. Omit to disable the
# probe (the run is bounded by model_wait_dead_seconds only, the
# pre-#233 behavior). Must be a non-empty http:// or https:// URL.
# The probe is a pure bypass: a probe failure is inconclusive and never
# fails the delivery.
# model_wait_probe_url = "http://127.0.0.1:18082/slots"
# The sustained-idle grace for the probe (seconds): how long the
# "every slot idle" state must hold before the request is declared
# swallowed. Default: 60 — short compared to the dead-request threshold
# so a swallow is recovered in ~1 minute, not ~30. Must be a finite
# positive number.
# model_wait_probe_seconds = 60
# Maximum concurrent Pilot tasks and enabled Runner timers on this machine.
# Must be 1 or 2 (the fixed timer instance set); missing means 1. The local AI/GPU can only serve one stable task, so keep
# the default. A slot (flock on <repo_dir>/.orbi/slots/slot-N) is
# taken before any claim and held for the whole delivery lifecycle
# (implement -> review -> fix -> merge); the kernel releases it when the
# Runner exits, however it exits. A Runner that cannot take a slot logs
# capacity_full and exits without claiming an Issue.
max_concurrency = 1
# Per-deployment systemd unit name (Issue #747): the multi-deployment
# runbook field. "core" installs orbi-core@1/2.timer + matching
# services for THIS config; unset keeps the shared orbi@1/2 names —
# only ONE deployment per machine may leave it unset. NEVER hand-write
# unit files: units outside every deployment's managed set are listed
# by `orbi doctor` under unmanaged_units.
# unit_name = "core"
# Task-worktree reclamation (Issue #760): at every tick start the Runner
# removes the registered task worktrees whose Issue is CLOSED and has
# been closed for at least this many hours (oldest first, at most 25 per
# tick). Open Issues and in-flight runs are never touched, and a failed
# removal is only a warning. Default: 72 — a closed Issue's scene stays
# inspectable for three days before reclamation. Must be a finite
# positive number of hours; anything else fails the start fast.
# worktree_retain_hours = 72
# Optional Pi model selection (Issue #119): passed to EVERY Pi session
# (implement and review) as --provider/--model/--thinking. Omit a key to
# keep Pi's own default for that setting; values are passed verbatim and
# recorded in the journal (non-sensitive model identifiers, never keys).
# pi_provider = "openai"
# pi_model = "gpt-5.6-sol"
# pi_thinking = "medium"
# Optional provider file (Issue #157): path to a JSON file in Pi's
# models.json shape (providers with baseUrl / api / apiKey / models).
# The file is the ONLY place a provider endpoint (baseUrl) may be
# configured; the TOML only selects the runtime provider/model above.
# `apiKey` is an env-var reference like "$GROQ_API_KEY" — never a key
# value. The Runner validates the file at startup (fail fast on a
# missing baseUrl, a selected provider/model that does not exist, or a
# missing env var for the selected provider's key) and passes the
# catalog to Pi through a per-run agent dir (PI_CODING_AGENT_DIR).
# pi_providers = ".orbi/pi-providers.json"

# Optional Pi skills. Paths may be absolute, use ~, or be relative to this file.
skills = []

# Optional Markdown context files injected into the prompt as paths.
context_files = []
