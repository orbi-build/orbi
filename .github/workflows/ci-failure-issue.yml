# CI Failure Issue (Issue #106): when the CI workflow (`.github/workflows/
# ci.yml`) fails on a push to main, file ONE deduplicated `bug` + `p0` +
# `ai-ready` Issue per failed job — the Orbi ready queue picks it up and
# delivers the fix through its normal single-Issue / single-PR /
# independent-review contract. The body carries the fixed `Outcome:` and
# `Acceptance:` lines the clarification gate reads, so the ticket is
# deliverable (Issue #1988). A failing CI run on a pull_request is NOT
# triaged (Issue #1988): that PR's own review/fix loop owns its CI, and a
# ticket filed for a PR branch outlives the PR (#1951 for #1944). When CI
# recovers, the matching Issue gets the recovery run evidence and is closed
# only with fix evidence relevant to it — a closing reference to the Issue on
# the run's PR (`Fixes #N`, Issue #715), or a diff since the latest recorded
# failure that touches the failing test's file (Issue #718); a green re-run
# of the same commit, or of any unrelated commit, keeps the Issue open.
#
# Runtime contract (verified against the official docs and the live API):
# `on: workflow_run` reacts ONLY to completed runs of the named validation
# workflows — the anti-recursion anchor, because Issue create/update/close emit
# no workflow_run for either validation workflow. The triage logic itself lives in `tools/ci_failure_triage.py`
# (unit-tested against the real REST shapes); this workflow is the thin
# entry: checkout, the pinned Python 3.14 (the CI convention), and the
# script — the default `bash -e` shell propagates a triage failure as a red
# job (no fake success). The Issue body is built only from the event payload
# and the jobs API response; no secret or token ever reaches it.
#
# Minimal permission set, declared explicitly: `actions: read` (read the
# completed CI run's jobs and the recorded failure job's log), `contents:
# read` (check out the triage script),
# `issues: write` (create/update/close the bug Issue), `pull-requests: read`
# (the recovery guard resolves the recovery run's PR via
# `GET commits/{sha}/pulls` to read its closing reference; the triage never
# writes to a PR — Issue #1988).
name: CI Failure Issue

on:
  workflow_run:
    workflows: ["CI", "Groq docs catalog check"]
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the triage script
        uses: actions/checkout@v5

      - name: Set up Python 3.14 (the CI convention)
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Triage the completed CI run (create / update / close the bug Issue)
        env:
          GH_TOKEN: ${{ github.token }}
          ORBI_ACTIVE_MILESTONE: ${{ vars.ORBI_ACTIVE_MILESTONE }}
        run: python3 tools/ci_failure_triage.py
