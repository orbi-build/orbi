# Remote CI gate for the repository contract (AGENTS.md): the full pytest
# suite with the tiered coverage gate (Issue #234: whole repository
# line >= 95% and branch >= 95% checked separately, changed Python code
# at 100% line/branch), run on GitHub for every pull request and every
# push to main (Issue #56).
#
# KISS: one job, no lint, no matrix, no cache.
#
# Python: production runs /usr/bin/python3 (3.14.6) on the Runner machine.
# GitHub-hosted runners do not have that interpreter at that path, so this
# workflow pins the same minor version (3.14) via actions/setup-python and
# runs the contract commands through the pinned `python3` on PATH. The
# difference is documented in docs/testing.mdx (the README homepage keeps
# the summary plus the link, Issue #241).
name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      # The release reconciliation tests (tests/test_release_v01.py) verify
      # the real annotated tag object (v0.1.0) and its commit relationships
      # with `git cat-file` / `git rev-parse` / `git merge-base --is-ancestor`
      # against the checkout. The default shallow checkout (fetch-depth: 1)
      # runs `git fetch --no-tags` (verified against the official
      # actions/checkout@v4 source), so the tag object is absent and the
      # test fails with `could not get object info` (Issue #126).
      # fetch-depth: 0 makes the action fetch all branches and
      # +refs/tags/*:refs/tags/* without --depth (full history plus every
      # tag object), so the release verification uses the real remote
      # objects. No tags are moved, overwritten, or rewritten.
      - name: Check out the repository (full history + all tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.14 (production minor version)
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install requirements and the test toolchain
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
          python3 -m pip install pytest coverage pyyaml

      # CLI packaging (Issue #140, #152): the console script must
      # install in a clean environment and the entry must work
      # (`muyan-pilot --help` and `muyan-pilot --version`, exit 0).
      # The packaging file is the PEP 621 pyproject.toml.
      #
      # The install uses the DOCUMENTED production flow — the EDITABLE
      # uv tool install (Issue #152), not a plain `pip install .` and
      # not a non-editable `uv tool install`: uv tool places the
      # executable at ~/.local/bin/muyan-pilot (the same path the
      # service template's ExecStart %h/.local/bin/muyan-pilot uses, so
      # the real `systemd-analyze --user verify` test resolves the
      # unit's absolute ExecStart against the real executable here),
      # and --editable makes the tool env import `muyan_pilot` from
      # the checkout instead of copying the source into site-packages —
      # the official local deployment, where the ExecStartPre checkout
      # sync is picked up by the next CLI process automatically.
      - name: Install uv (the documented CLI installer)
        run: |
          python3 -m pip install uv
          uv --version

      - name: Install the CLI (uv tool EDITABLE, the documented flow) and verify the entry and import source (Issue #140, #152)
        run: |
          uv tool install --force --reinstall --editable --python 3.14 .
          ~/.local/bin/muyan-pilot --help
          ~/.local/bin/muyan-pilot --version
          # Issue #152/#168: the editable install must import the
          # `muyan_pilot` package from the checkout's `src/` layout
          # (not a site-packages copy): the tool env's python (the
          # console script's own interpreter, from its shebang)
          # reports the import source and it must sit inside
          # `$GITHUB_WORKSPACE/src/muyan_pilot/`. The probe runs from
          # a NEUTRAL cwd (`cd /`): `python -c` puts the cwd first on
          # sys.path, so the probe must never depend on the checkout
          # cwd (the package lives in `src/`; the checkout root
          # carries no `muyan_pilot.py` that could shadow it).
          tool_python=$(head -n 1 ~/.local/bin/muyan-pilot | sed 's/^#!//')
          source_path=$(cd / && "$tool_python" -c "import muyan_pilot; print(muyan_pilot.__file__)")
          case "$source_path" in
            "$GITHUB_WORKSPACE"/src/muyan_pilot/*)
              echo "cli_source ok: $source_path"
              ;;
            *)
              echo "cli_source DRIFT: $source_path (expected $GITHUB_WORKSPACE/src/muyan_pilot/)" >&2
              exit 1
              ;;
          esac

      - name: Run the full test suite with branch coverage (contract)
        run: python3 -m coverage run --branch -m pytest tests/ -q

      # Tiered coverage gate (Issue #234): the whole repository keeps
      # line >= 95% AND branch >= 95% (coverage_gate.py checks the two
      # tiers SEPARATELY from the coverage JSON totals — never a merged
      # single percentage), and the Python lines/branches changed in
      # this PR keep 100% (diff_coverage_gate.py against origin/main;
      # a doc-only PR has no changed Python and passes). The report
      # keeps showing both real numbers as evidence.
      - name: Enforce the tiered coverage gate (contract, Issue #234)
        run: |
          python3 -m coverage report --show-missing
          python3 coverage_gate.py
          python3 diff_coverage_gate.py origin/main

      # Mintlify docs build smoke (Issue #116): the official `mint` CLI
      # validates the docs/ build (docs.json config, pages, links) in
      # strict mode — non-zero exit on any warning or error. Same single
      # job: no second job, no cache, no matrix.
      - name: Install the Mintlify CLI (docs build smoke)
        run: npm install -g mint

      - name: Validate the Mintlify docs build (Issue #116)
        run: cd docs && mint validate
