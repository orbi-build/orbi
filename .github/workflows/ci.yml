# Remote CI gate for the repository contract (AGENTS.md): the full pytest
# suite with 100% line/branch coverage, run on GitHub for every pull
# request and every push to main (Issue #56).
#
# KISS: one job, no lint, no matrix, no cache.
#
# Python: production runs /usr/bin/python3 (3.14.6) on the Runner machine.
# GitHub-hosted runners do not have that interpreter at that path, so this
# workflow pins the same minor version (3.14) via actions/setup-python and
# runs the contract commands through the pinned `python3` on PATH. The
# difference is documented in the README section "远程 CI（GitHub Actions）".
name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      # The release reconciliation tests (tests/test_release_v01.py) verify
      # the real annotated tag object (v0.1.0) and its commit relationships
      # with `git cat-file` / `git rev-parse` / `git merge-base --is-ancestor`
      # against the checkout. The default shallow checkout (fetch-depth: 1)
      # runs `git fetch --no-tags` (verified against the official
      # actions/checkout@v4 source), so the tag object is absent and the
      # test fails with `could not get object info` (Issue #126).
      # fetch-depth: 0 makes the action fetch all branches and
      # +refs/tags/*:refs/tags/* without --depth (full history plus every
      # tag object), so the release verification uses the real remote
      # objects. No tags are moved, overwritten, or rewritten.
      - name: Check out the repository (full history + all tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.14 (production minor version)
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install requirements and the test toolchain
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
          python3 -m pip install pytest coverage pyyaml

      - name: Run the full test suite with branch coverage (contract)
        run: python3 -m coverage run --branch -m pytest tests/ -q

      - name: Enforce 100% line/branch coverage (contract)
        run: python3 -m coverage report --fail-under=100 --show-missing

      # Mintlify docs build smoke (Issue #116): the official `mint` CLI
      # validates the docs/ build (docs.json config, pages, links) in
      # strict mode — non-zero exit on any warning or error. Same single
      # job: no second job, no cache, no matrix.
      - name: Install the Mintlify CLI (docs build smoke)
        run: npm install -g mint

      - name: Validate the Mintlify docs build (Issue #116)
        run: cd docs && mint validate
