name: Publish Docker image

on:
  release:
    types: [published]
  # The build-only job is the check for the publish configuration; run it on
  # every PR that touches the image or this workflow (Issue #1040).
  pull_request:
    paths:
      - "3rd/docker/**"
      - ".github/workflows/docker-image.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v0.5.17"
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  release_ref: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}

jobs:
  build-only:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the source
        uses: actions/checkout@v5
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set release image version
        run: |
          # On pull_request the ref is "<n>/merge", which is not a valid tag;
          # build under pr-<n> instead (nothing is pushed in this job).
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            version="pr-${{ github.event.pull_request.number }}"
          else
            version="${release_ref#v}"
          fi
          test -n "$version"
          echo "IMAGE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Build the Docker image without pushing
        uses: docker/build-push-action@v6
        with:
          context: 3rd/docker
          file: 3rd/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          tags: |
            ghcr.io/orbi-build/orbi:${{ env.IMAGE_VERSION }}
            ghcr.io/orbi-build/orbi:latest

  docker:
    # Publishing never runs for pull_request events; the build-only job is the PR check.
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DOCKERHUB_ENABLED: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - name: Check out the release
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name || github.ref }}

      - name: Set release image version
        run: |
          version="${release_ref#v}"
          test -n "$version"
          echo "IMAGE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ github.repository == 'orbi-build/orbi' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push to GHCR
        if: ${{ github.repository == 'orbi-build/orbi' }}
        uses: docker/build-push-action@v6
        with:
          context: 3rd/docker
          file: 3rd/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/orbi-build/orbi:${{ env.IMAGE_VERSION }}
            ghcr.io/orbi-build/orbi:latest

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_ENABLED == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push to Docker Hub
        if: env.DOCKERHUB_ENABLED == 'true'
        uses: docker/build-push-action@v6
        with:
          context: 3rd/docker
          file: 3rd/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            docker.io/orbibuild/orbi:${{ env.IMAGE_VERSION }}
            docker.io/orbibuild/orbi:latest

      - name: Publish Docker Hub overview
        # The overview is documentation; a Docker Hub token without the Delete
        # scope gets 403 here and must not fail a release whose images are pushed.
        continue-on-error: true
        if: env.DOCKERHUB_ENABLED == 'true'
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: orbibuild/orbi
          readme-filepath: 3rd/docker/README.dockerhub.md
